{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% macro body() %}
<div class="text-center py-5">
  <div class="display-4 fw-bold text-brand">{{ code }}</div>
  <p class="lead">{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('main.landing') }}">Go home</a>
</div>
{% endmacro %}
{% block content %}{{ body() }}{% endblock %}
{% block public %}<div class="container">{{ body() }}</div>{% endblock %}
