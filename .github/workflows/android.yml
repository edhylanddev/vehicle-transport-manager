# Builds the Android app. Run it from the GitHub "Actions" tab → "Android app" → "Run workflow".
# The APK appears under the run's "Artifacts". Copy it to app/static/downloads/vtm.apk on the server.
name: Android app

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version name shown to users (e.g. 1.0.1)"
        required: true
        default: "1.0.0"
  push:
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.VTM_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME is set);
      # Gradle downloads any missing platform/build-tools itself.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vtm-release.jks"
          echo "VTM_KEYSTORE_FILE=$RUNNER_TEMP/vtm-release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          VTM_KEYSTORE_PASSWORD: ${{ secrets.VTM_KEYSTORE_PASSWORD }}
          VTM_KEY_ALIAS: ${{ secrets.VTM_KEY_ALIAS }}
          VTM_KEY_PASSWORD: ${{ secrets.VTM_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION_NAME="${{ inputs.versionName || '1.0.0' }}"
          VERSION_CODE="${{ github.run_number }}"
          TASKS="assembleDebug"
          if [ -n "$KEYSTORE_B64" ]; then TASKS="$TASKS assembleRelease"; fi
          ./gradlew --no-daemon $TASKS -PversionCode=$VERSION_CODE -PversionName="$VERSION_NAME"
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/vtm-${VERSION_NAME}-${VERSION_CODE}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "../dist/vtm-${VERSION_NAME}-${VERSION_CODE}.apk"
          fi
          {
            echo "### Android build"
            echo "- versionName: \`$VERSION_NAME\`"
            echo "- versionCode: \`$VERSION_CODE\`  ← put this in ANDROID_VERSION_CODE on the server"
            if [ -n "$KEYSTORE_B64" ]; then echo "- Signed release APK: yes"; else echo "- Signed release APK: **no** (add the VTM_* secrets); only the debug APK was built"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: vtm-android-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
